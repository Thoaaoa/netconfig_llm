name: ospfgen

topology:
  nodes:
    R1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - ospfd
      startup-config: configs/R1.conf
      enforce-startup-config: true
    R2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - ospfd
      startup-config: configs/R2.conf
      enforce-startup-config: true

  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
